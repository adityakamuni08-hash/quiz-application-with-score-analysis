<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Take Quiz | QuizPulse</title><link rel="stylesheet" th:href="@{/styles.css}"></head><body><header class="topbar"><a class="brand" href="/login"><span class="brand-mark small">Q</span> QuizPulse</a><a class="text-link" th:href="@{/student(name=${name},userId=${userId})}">← Back to dashboard</a></header><main class="quiz-page"><section class="quiz-intro"><p class="eyebrow">QUIZ IN PROGRESS</p><h1 th:text="${topic}">Quiz</h1><p class="muted">Select one answer for each question. You can submit when you are ready.</p><div class="progress-track"><div id="progressBar"></div></div><small id="progressText" class="muted">0 answered</small></section><form method="post" action="/quiz/submit" id="quizForm"><input type="hidden" name="name" th:value="${name}"><input type="hidden" name="userId" th:value="${userId}"><input type="hidden" name="topic" th:value="${topic == 'All Topics' ? '' : topic}"><article class="question-card" th:each="q,stat : ${questions}"><div class="question-meta"><span th:text="'QUESTION ' + (${stat.index}+1)">QUESTION 1</span><span>1 POINT</span></div><h2 th:text="${q.questionText}">Question</h2><div class="option-list"><label class="option"><input type="radio" th:name="${'q_' + q.id}" value="A"><span class="option-letter">A</span><span th:text="${q.optionA}">Option A</span></label><label class="option"><input type="radio" th:name="${'q_' + q.id}" value="B"><span class="option-letter">B</span><span th:text="${q.optionB}">Option B</span></label><label class="option"><input type="radio" th:name="${'q_' + q.id}" value="C"><span class="option-letter">C</span><span th:text="${q.optionC}">Option C</span></label><label class="option"><input type="radio" th:name="${'q_' + q.id}" value="D"><span class="option-letter">D</span><span th:text="${q.optionD}">Option D</span></label></div></article><div class="submit-row"><p class="muted">Review your selections before submitting.</p><button class="primary-btn" type="submit">Submit answers <span>→</span></button></div></form></main><script>const form=document.getElementById('quizForm');const radios=[...form.querySelectorAll('input[type=radio]')];function update(){const groups=[...new Set(radios.map(r=>r.name))];const answered=groups.filter(g=>form.querySelector('input[name="'+g+'"]:checked')).length;document.getElementById('progressText').textContent=answered+' of '+groups.length+' answered';document.getElementById('progressBar').style.width=(groups.length?answered/groups.length*100:0)+'%'}radios.forEach(r=>r.addEventListener('change',update));document.querySelectorAll('.option input').forEach(r=>r.addEventListener('change',()=>{document.querySelectorAll('label.option').forEach(l=>l.classList.remove('selected'));document.querySelectorAll('input[type=radio]:checked').forEach(c=>c.closest('label').classList.add('selected'))}));</script></body></html>
