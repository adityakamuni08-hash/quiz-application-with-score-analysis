<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Result | QuizPulse</title><link rel="stylesheet" th:href="@{/styles.css}"></head><body><header class="topbar"><a class="brand" href="/login"><span class="brand-mark small">Q</span> QuizPulse</a><span class="role-chip">RESULT ANALYSIS</span></header><main class="result-page"><section class="result-card"><div class="result-check">✓</div><p class="eyebrow">QUIZ COMPLETED</p><h1>Nice work, <span th:text="${name}">Student</span>!</h1><p class="muted">Here is your performance breakdown.</p><div class="score-ring" th:style="|--score:${result.percentage}%|"><div><strong th:text="${#numbers.formatDecimal(result.percentage,1,1)} + '%'">80%</strong><span>YOUR SCORE</span></div></div><h2 th:text="${result.topic}">Quiz</h2><div class="result-metrics"><div><span>Correct answers</span><strong th:text="${result.score + ' / ' + result.totalQuestions}">4/5</strong></div><div><span>Points missed</span><strong th:text="${result.totalQuestions - result.score}">1</strong></div><div><span>Performance</span><strong th:text="${result.percentage >= 80 ? 'Excellent' : (result.percentage >= 50 ? 'Good effort' : 'Keep practising')}">Good effort</strong></div></div><p class="feedback" th:text="${result.percentage >= 80 ? 'Excellent work! Keep building on this strong result.' : (result.percentage >= 50 ? 'Good effort. Review the topics you found difficult and try again.' : 'Keep practising. Review the concepts and take another quiz to improve.')}">Feedback</p><div class="button-row"><a class="primary-btn" th:href="@{/student(name=${name},userId=${userId})}">Back to dashboard</a><a class="secondary-btn" th:href="@{/quiz(name=${name},userId=${userId})}">Try another quiz</a></div></section></main></body></html>
